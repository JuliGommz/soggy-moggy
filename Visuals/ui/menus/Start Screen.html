<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Soggy Moggy — Start Screen Layouts</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; background: #1a1a22; color: #e8e4d8; font-family: 'VT323', monospace; height: 100%; overflow: hidden; }
    * { box-sizing: border-box; }
    button { font-family: inherit; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-2px); } to { opacity: 1; transform: translateY(0); } }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="start-screen-A.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "useScreenshotBg": true,
      "difficultyVariant": "segmented",
      "paused": false,
      "scanlines": false,
      "bgBrightness": 0.7
    }/*EDITMODE-END*/;

    function App() {
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
      // Lower brightness override for these mockups so the cat reads better
      const sharedTweaks = { ...tweaks };

      return (
        <>
          <DesignCanvas
            title="Soggy Moggy — Start Screen (Locked)"
            subtitle="Layout 7 (Two cards) + Dev-Tools panel (Tabs)."
          >
            <DCSection id="locked" title="LOCKED">
              <DCArtboard id="LK-C" label="Menu · DEV chip centered" width={480} height={640}>
                <StartScreen tweaks={{ ...sharedTweaks, layout: "flat-grid", devPosition: "center" }} />
              </DCArtboard>
              <DCArtboard id="LKD" label="Dev panel — Tabs" width={480} height={640}>
                <StartScreen tweaks={{ ...sharedTweaks, layout: "flat-grid", devOpen: true, devVariant: "tabs" }} />
              </DCArtboard>
            </DCSection>
          </DesignCanvas>

          <TweaksPanel title="Tweaks">
            <TweakSection title="Difficulty">
              <TweakRadio
                label="Pattern"
                value={tweaks.difficultyVariant}
                options={[
                  { value: "list", label: "List" },
                  { value: "segmented", label: "Segmented" },
                ]}
                onChange={(v) => setTweak('difficultyVariant', v)}
              />
            </TweakSection>
            <TweakSection title="State">
              <TweakToggle label="Paused (CONTINUE)" value={tweaks.paused} onChange={(v) => setTweak('paused', v)} />
            </TweakSection>
            <TweakSection title="Style">
              <TweakToggle label="CRT scanlines" value={tweaks.scanlines} onChange={(v) => setTweak('scanlines', v)} />
              <TweakToggle label="Use screenshot bg" value={tweaks.useScreenshotBg} onChange={(v) => setTweak('useScreenshotBg', v)} />
            </TweakSection>
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
