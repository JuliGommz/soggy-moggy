<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soggy Moggy</title>

  <!-- Google Fonts for the Start-Screen overlay (VT323 = body, Press Start 2P = block titles) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet" />

  <style>
    @font-face {
      font-family: 'BlockCraft';
      src: url('Visuals/fonts/BlockCraft.otf') format('opentype');
      font-display: block;
    }
    body { margin: 0; background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; }
    /* NO width/height rules on canvas — sizing is done exclusively in JS (see src/main.js) */
    canvas { display: block; }

    /* Game frame wraps canvas + overlay so they share an exact 480×640 footprint.
       Without the wrapper, the overlay (position:absolute) would anchor to the
       viewport while flex centers the canvas, leaving them misaligned. */
    .game-frame { position: relative; width: 480px; height: 640px; }

    /* Overlay shared rules — pointer-events:none by default; script adds .sm-active to enable. */
    #sm-start-root,
    #sm-gameover-root,
    #sm-success-root,
    #sm-levelcomplete-root {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      image-rendering: pixelated;
    }
    #sm-start-root.sm-active,
    #sm-gameover-root.sm-active,
    #sm-success-root.sm-active,
    #sm-levelcomplete-root.sm-active { pointer-events: auto; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-2px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="game-frame">
    <canvas id="gameCanvas"></canvas>
    <div id="sm-start-root"></div>
    <div id="sm-gameover-root"></div>
    <div id="sm-success-root"></div>
    <div id="sm-levelcomplete-root"></div>
  </div>

  <!-- ══════════════════════════════════════════════════════════════════════
       Game scripts — classic <script> tags. Load order matters.

       Each file declares globals that the following files read; cross-file
       references are by name (no import/export). Order is:

         1. dev-flags.js          — devFlags object (no dependencies)
         2. game-state.js         — GamePhase, GameState, resetGame, prefs
         3. audio.js              — HTMLAudio music + SFX (file:// safe)
         4. input.js              — keyboard + mouse listeners, keys map
         5. player.js             — physics + sprite, JUMP_VELOCITY
         6. platforms.js          — generation + collision + rendering
         7. hazards.js            — smog / electricity / flood renderers
         8. background.js         — parallax background layers
         9. enemies.js            — wasp enemy system
        10. dialogue.js           — bubble overlay + lifecycle
        11. main.js               — canvas init, game loop, HUD, outro triggers

       React DOM overlays load last so the globals above are already defined
       when the overlays' mount functions are called. Babel is intentionally
       NOT used: browsers block the XHR Babel needs for external src= scripts
       on file:// (Firefox blocks it for ALL local files), so every overlay
       file uses plain React.createElement instead of JSX.

        12. React + ReactDOM (UMD bundles via unpkg)
        13. start-screen.js        — Start menu + Dev tools panel
        14. gameover-screen.js     — GAMEOVER overlay
        15. success-screen.js      — L3 LEVEL_COMPLETE overlay
        16. levelcomplete-screen.js — L1 / L2 LEVEL_COMPLETE overlay
       ══════════════════════════════════════════════════════════════════════ -->

  <script src="src/dev-flags.js"></script>
  <script src="src/game-state.js"></script>
  <script src="src/audio.js?v=20260427a"></script>
  <script src="src/input.js"></script>
  <script src="src/player.js"></script>
  <script src="src/platforms.js"></script>
  <script src="src/hazards.js"></script>
  <script src="src/background.js"></script>
  <script src="src/enemies.js"></script>
  <script src="src/dialogue.js"></script>
  <script src="src/main.js"></script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="src/start-screen.js?v=20260427a"></script>
  <script src="src/gameover-screen.js"></script>
  <script src="src/success-screen.js"></script>
  <script src="src/levelcomplete-screen.js"></script>
</body>
</html>
